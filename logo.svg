<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="桃花台コードクラブ">
  <title>桃花台コードクラブ</title>
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A5C"/>
      <stop offset="100%" stop-color="#FF4E8B"/>
    </linearGradient>
  </defs>

  <!-- 背景：角丸正方形 -->
  <rect width="48" height="48" rx="12" fill="url(#lg)"/>

  <!-- 光彩 -->
  <circle cx="24" cy="26" r="15" fill="rgba(255,255,255,0.10)"/>

  <!-- 桜（5枚花びら）中心 (24, 26) -->
  <g transform="translate(24,26)">
    <ellipse cx="0" cy="-9.5" rx="4.2" ry="7"   fill="rgba(255,255,255,0.85)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-9.5" rx="4.2" ry="7"   fill="rgba(255,255,255,0.85)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-9.5" rx="4.2" ry="7"   fill="rgba(255,255,255,0.85)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-9.5" rx="4.2" ry="7"   fill="rgba(255,255,255,0.85)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-9.5" rx="4.2" ry="7"   fill="rgba(255,255,255,0.85)" transform="rotate(288)"/>
    <!-- 花心 -->
    <circle cx="0" cy="0" r="4"   fill="#FFE082"/>
    <circle cx="0" cy="0" r="1.8" fill="#FF7A5C" opacity="0.65"/>
  </g>

  <!-- コードタグ（上部） -->
  <text x="24" y="11"
        font-family="'Courier New',Courier,monospace"
        font-size="7" font-weight="900"
        fill="rgba(255,255,255,0.5)"
        text-anchor="middle">&lt;/&gt;</text>
</svg>
