<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="桃花台コードクラブ">
  <title>桃花台コードクラブ</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A5C"/>
      <stop offset="100%" stop-color="#FF4E8B"/>
    </linearGradient>
    <radialGradient id="helm" cx="36%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="100%" stop-color="#FFDCB4"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="10.5" fill="url(#bg)"/>

  <!-- Helmet glow ring -->
  <circle cx="22.5" cy="24" r="16.5" fill="rgba(91,192,235,0.18)" stroke="rgba(255,255,255,0.55)" stroke-width="1.1"/>
  <!-- Helmet face -->
  <circle cx="22.5" cy="24" r="13.5" fill="url(#helm)"/>
  <!-- Helmet shine -->
  <ellipse cx="27.8" cy="17.3" rx="5.3" ry="3" fill="white" opacity=".22" transform="rotate(-20,27.8,17.3)"/>

  <!-- Eyes -->
  <circle cx="16.5" cy="22.5" r="3" fill="#1A0A3D"/>
  <circle cx="28.5" cy="22.5" r="3" fill="#1A0A3D"/>
  <!-- Pupils -->
  <circle cx="17.6" cy="21.4" r="1.1" fill="white"/>
  <circle cx="29.6" cy="21.4" r="1.1" fill="white"/>
  <!-- Shine -->
  <circle cx="17.3" cy="21" r="0.5" fill="#5BC0EB"/>
  <circle cx="29.3" cy="21" r="0.5" fill="#5BC0EB"/>

  <!-- Cheeks -->
  <ellipse cx="12" cy="27" rx="3.4" ry="2.3" fill="#FFB3C6" opacity=".6"/>
  <ellipse cx="33" cy="27" rx="3.4" ry="2.3" fill="#FFB3C6" opacity=".6"/>

  <!-- Smile -->
  <path d="M15 28.5 Q22.5 35.3 30 28.5" stroke="#1A0A3D" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Antenna -->
  <line x1="22.5" y1="10.5" x2="22.5" y2="5.3" stroke="#6B3FA0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Star -->
  <polygon points="22.5,0.8 23.4,3.8 26.4,3.8 24,5.6 24.9,8.6 22.5,6.8 20.1,8.6 21,5.6 18.6,3.8 21.6,3.8" fill="#FFE082"/>
</svg>
