<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="桃花台コードクラブ">
  <title>桃花台コードクラブ</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A5C"/>
      <stop offset="100%" stop-color="#FF4E8B"/>
    </linearGradient>
    <radialGradient id="helm" cx="36%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="100%" stop-color="#FFDCB4"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="10.5" fill="url(#bg)"/>

  <!-- Helmet glow ring -->
  <circle cx="24" cy="25" r="17" fill="rgba(91,192,235,0.18)" stroke="rgba(255,255,255,0.55)" stroke-width="1.1"/>
  <!-- Helmet face -->
  <circle cx="24" cy="25" r="14" fill="url(#helm)"/>
  <!-- Helmet shine -->
  <ellipse cx="29.3" cy="18.3" rx="5.3" ry="3" fill="white" opacity=".22" transform="rotate(-20,29.3,18.3)"/>

  <!-- Eyes -->
  <circle cx="18" cy="23.5" r="3" fill="#1A0A3D"/>
  <circle cx="30" cy="23.5" r="3" fill="#1A0A3D"/>
  <!-- Pupils -->
  <circle cx="19.1" cy="22.4" r="1.1" fill="white"/>
  <circle cx="31.1" cy="22.4" r="1.1" fill="white"/>
  <!-- Shine -->
  <circle cx="18.8" cy="22" r="0.5" fill="#5BC0EB"/>
  <circle cx="30.8" cy="22" r="0.5" fill="#5BC0EB"/>

  <!-- Cheeks -->
  <ellipse cx="13.5" cy="28" rx="3.4" ry="2.3" fill="#FFB3C6" opacity=".6"/>
  <ellipse cx="34.5" cy="28" rx="3.4" ry="2.3" fill="#FFB3C6" opacity=".6"/>

  <!-- Smile -->
  <path d="M16.5 29.5 Q24 36.3 31.5 29.5" stroke="#1A0A3D" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Antenna -->
  <line x1="24" y1="11.5" x2="24" y2="6.3" stroke="#6B3FA0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Star -->
  <polygon points="24,1.8 24.9,4.8 27.9,4.8 25.5,6.6 26.4,9.6 24,7.8 21.6,9.6 22.5,6.6 20.1,4.8 23.1,4.8" fill="#FFE082"/>
</svg>
